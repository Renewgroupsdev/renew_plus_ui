name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o renew_plus_ui.zip -d extracted

      - name: Move extracted files
        run: |
          cp -r extracted/* .
          rm -rf extracted
          rm -f renew_plus_ui.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract renew_plus_ui ZIP" || echo "No changes to commit"
          git push
